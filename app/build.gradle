plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.vibrationtester'
    // 36-ra emelve, hogy az Android 16-os envelope/frekvencia API
    // (VibrationEffect.BasicEnvelopeBuilder, API 36) elérhető legyen
    // fordításkor. A targetSdk szándékosan marad 34-en, hogy a régebbi
    // viselkedés a többi funkción ne változzon.
    compileSdk 36

    defaultConfig {
        applicationId "com.example.vibrationtester"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "2.1.0"
    }

    // KRITIKUS: enélkül minden egyes GitHub Actions futás egy vadonatúj,
    // ideiglenes debug-kulcsot generált volna (mert a friss futtatógépen
    // nincs korábbi ~/.android/debug.keystore), így minden kiadott apk más
    // aláírással rendelkezett. Emiatt egy már telepített korábbi verzióra
    // egy újabbat telepíteni "az alkalmazás nincs telepítve" hibával
    // elutasította a rendszer, "mégis telepítés" lehetőség nélkül - ez nem
    // Play Protect figyelmeztetés, hanem alapvető aláírás-ütközés. A
    // "debug" nevű signingConfig felülírja az AGP beépített, alapértelmezett
    // debug-aláírását egy a repóban tárolt, állandó kulccsal (app/debug.keystore),
    // így minden jövőbeli build ugyanazzal az aláírással készül, és a
    // frissítések zökkenőmentesen települnek egymásra.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Lets the debug build be installed side-by-side with a previously
            // released release build while testing.
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
