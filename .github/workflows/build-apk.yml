name: Build APK

# Ez a workflow a projektet Android SDK-val és Gradle-lel rendelkező
# GitHub-futtatókörnyezetben fordítja le - ilyen környezet a fejlesztői
# gépemen (ahol ez a kód készült) nem állt rendelkezésre, ezért a tényleges
# .apk-t csak itt, a push után lehet előállítani.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        # A projektben nincs bináris gradle-wrapper.jar mellékelve (azt csak
        # internet-hozzáféréssel/Android Studio-val lehet legenerálni), ezért
        # itt, a CI futtatón generáljuk le a preinstallált Gradle-lel.
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rezges-teszteld-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
